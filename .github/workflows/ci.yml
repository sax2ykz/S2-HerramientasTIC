name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependencias
        run: npm install

      - name: Ejecutar pruebas
        run: npm test

      - name: Despliegue simulado
        run: |
          mkdir -p dist
          cp package.json dist/
          echo "🚀 Despliegue exitoso — build empaquetado el $(date -u +'%Y-%m-%d %H:%M UTC')"
          ls -la dist/

      - name: Publicar artefacto de despliegue
        uses: actions/upload-artifact@v4
        with:
          name: dist-artifact
          path: dist/
